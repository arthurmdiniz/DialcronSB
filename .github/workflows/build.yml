name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms
        shell: pwsh
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --ignore-failed-sources

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'DialcronSB/DialcronSB.csproj'
          $group = $proj.Project.PropertyGroup | Where-Object { $_.ApplicationDisplayVersion } | Select-Object -First 1
          "tag=v$($group.ApplicationDisplayVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore DialcronSB/DialcronSB.csproj

      - name: Publish Windows
        shell: pwsh
        run: dotnet publish DialcronSB/DialcronSB.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore -p:ApplicationVersion=${{ github.run_number }}

      - name: Publish Android signed
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("dialcron.keystore", $bytes)
          dotnet publish DialcronSB/DialcronSB.csproj -f net10.0-android -c Release --no-restore `
            -p:ApplicationVersion=${{ github.run_number }} `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=dialcron.keystore `
            -p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS `
            -p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD `
            -p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD

      - name: Publish Android debug
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        shell: pwsh
        run: dotnet publish DialcronSB/DialcronSB.csproj -f net10.0-android -c Debug --no-restore -p:ApplicationVersion=${{ github.run_number }} -p:AndroidPackageFormat=apk

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dialcron-Windows
          path: DialcronSB/release/*

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dialcron-Android
          path: DialcronSB/**/*.apk

      - name: Create or update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $assets = @()

          $exe = Get-ChildItem 'DialcronSB/release' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          if ($exe) { $assets += $exe.FullName }

          $apk = Get-ChildItem 'DialcronSB' -Recurse -Filter '*.apk' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($apk) { $assets += $apk.FullName }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              gh release upload $tag $asset --clobber
            }
          } else {
            if ($assets.Count -gt 0) {
              gh release create $tag --generate-notes --title "Dialcron $tag" $assets
            } else {
              gh release create $tag --generate-notes --title "Dialcron $tag"
            }
          }
